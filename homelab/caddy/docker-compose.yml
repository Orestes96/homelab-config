services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - /home/elliot/Caddyfile:/etc/caddy/Caddyfile
      - /home/elliot/caddy-certs:/certs
      - ./data:/data
      - ./config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
