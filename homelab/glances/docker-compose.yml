services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    pid: host
    ports:
      - "61208:61208"
    environment:
      - GLANCES_OPT=-w
      - TZ=Europe/London
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /srv/media:/srv/media:ro
    restart: unless-stopped
