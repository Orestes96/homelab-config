services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: "1000:1000"
    group_add:
      - "${RENDER_GID}"
    ports:
      - "8096:8096"
    volumes:
      - ./config:/config
      - ./cache:/cache
      - /srv/media:/data:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      - TZ=Europe/London
      - JELLYFIN_PublishedServerUrl=http://jellyfin.home.arpa
    restart: unless-stopped
