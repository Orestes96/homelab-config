groups:
  - name: endpoints
    rules:
      - alert: EndpointDown
        expr: probe_success{job=~"blackbox_http|blackbox_https_selfsigned",tier="core"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.instance }} is not responding'

      - alert: EndpointDown
        expr: probe_success{job=~"blackbox_http|blackbox_https_selfsigned",tier="standard"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.instance }} is not responding'

      - alert: DnsDown
        expr: probe_success{job="blackbox_dns",tier="core"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 'Primary DNS {{ $labels.instance }} is not answering home.arpa lookups'

      - alert: DnsDown
        expr: probe_success{job="blackbox_dns",tier="standard"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Secondary DNS {{ $labels.instance }} is not answering home.arpa lookups'

      - alert: CertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'Certificate for {{ $labels.instance }} expires in {{ $value | printf "%.0f" }} days'
