services:
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    ports:
      - "192.168.20.100:53:53/tcp"
      - "192.168.20.100:53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    restart: unless-stopped
