services:
  makemkv:
    image: jlesage/makemkv
    container_name: makemkv
    ports:
      - "5800:5800"
    volumes:
      - ./config:/config
      - /srv/media/rips:/output
      - /dev:/dev
    device_cgroup_rules:
      - 'b 11:* rmw'
      - 'c 21:* rmw'
    environment:
      - USER_ID=1000
      - GROUP_ID=1000
      - SUP_GROUP_IDS=24
      - TZ=Europe/London
      - AUTO_DISC_RIPPER=1
      - AUTO_DISC_RIPPER_EJECT=1
      - AUTO_DISC_RIPPER_PARALLEL_RIP=1
    restart: unless-stopped
